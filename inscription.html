<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Créer un compte — SEDAKOR</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <h1>SEDAKOR</h1>

                <p>
                    Créez votre compte
                </p>

            </div>


            <form
                id="registerForm"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="nom">
                        Nom
                    </label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        placeholder="Votre nom"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="vous@exemple.com"
                        maxlength="255"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="8 caractères minimum"
                        minlength="8"
                        maxlength="72"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div
                    id="registerMessage"
                    class="auth-message"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    class="auth-button"
                    id="registerButton"
                >
                    Créer mon compte
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Vous avez déjà un compte ?
                </p>

                <a href="connexion.html">
                    Se connecter
                </a>

            </div>

        </section>

    </main>


    <script src="js/register.js"></script>

</body>

</html>
