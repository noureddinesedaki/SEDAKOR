<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow - Gestionnaire de tâches</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header>
        <h1>TaskFlow</h1>
        <p>Organisez vos tâches simplement.</p>
    </header>


    <main>

        <!-- =========================
             AJOUTER UNE TÂCHE
        ========================== -->

        <section id="ajout-tache">

            <h2>Ajouter une tâche</h2>

            <p id="compteur-taches">
                0 tâche
            </p>

            <form id="formulaire-tache">

                <input
                    type="text"
                    id="tache"
                    placeholder="Ex : Apprendre JavaScript"
                    autocomplete="off"
                >

                <select id="priorite">

                    <option value="basse">
                        Priorité basse
                    </option>

                    <option
                        value="moyenne"
                        selected
                    >
                        Priorité moyenne
                    </option>

                    <option value="haute">
                        Priorité haute
                    </option>

                </select>

                <input
                    type="date"
                    id="date-echeance"
                >

                <button type="submit">
                    Ajouter
                </button>

            </form>

        </section>


        <!-- =========================
             LISTE DES TÂCHES
        ========================== -->

        <section id="liste-taches">

            <h2>Mes tâches</h2>


            <!-- Recherche -->

            <input
                type="text"
                id="recherche"
                placeholder="Rechercher une tâche..."
                autocomplete="off"
            >


            <!-- Filtres -->

            <div id="filtres">

                <button
                    type="button"
                    data-filtre="toutes"
                >
                    Toutes
                </button>

                <button
                    type="button"
                    data-filtre="en-cours"
                >
                    En cours
                </button>

                <button
                    type="button"
                    data-filtre="terminees"
                >
                    Terminées
                </button>

            </div>


            <!-- Tri -->

            <div id="tri">

                <label for="tri-taches">
                    Trier par :
                </label>

                <select id="tri-taches">

                    <option value="recentes">
                        Plus récentes
                    </option>

                    <option value="anciennes">
                        Plus anciennes
                    </option>

                    <option value="priorite-haute">
                        Priorité haute → basse
                    </option>

                    <option value="priorite-basse">
                        Priorité basse → haute
                    </option>

                    <option value="echeance">
                        Échéance la plus proche
                    </option>

                </select>

            </div>


            <!-- Liste -->

            <div id="taches">
                <!-- Les tâches seront ajoutées avec JavaScript -->
            </div>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
