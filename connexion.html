<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Se connecter — SEDAKOR</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <h1>SEDAKOR</h1>

                <p>
                    Connectez-vous à votre compte
                </p>

            </div>


            <form
                id="loginForm"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="vous@exemple.com"
                        maxlength="255"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="loginMessage"
                    class="auth-message"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    class="auth-button"
                    id="loginButton"
                >
                    Se connecter
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Vous n'avez pas encore de compte ?
                </p>

                <a href="inscription.html">
                    Créer un compte
                </a>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
