<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mot de passe oublié — SEDAKOR</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <h1>SEDAKOR</h1>

                <p>
                    Réinitialisez votre mot de passe
                </p>

            </div>

            <form
                id="resetRequestForm"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="vous@exemple.com"
                        maxlength="255"
                        autocomplete="email"
                        required
                    >

                </div>

                <div
                    id="resetRequestMessage"
                    class="auth-message"
                    aria-live="polite"
                ></div>

                <button
                    type="submit"
                    class="auth-button"
                    id="resetRequestButton"
                >
                    Réinitialiser mon mot de passe
                </button>

            </form>

            <div class="auth-footer">

                <a href="connexion.html">
                    Retour à la connexion
                </a>

            </div>

        </section>

    </main>

    <script src="js/password-reset-request.js"></script>

</body>

</html>
